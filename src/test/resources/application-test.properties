# A separate database, so tests never touch the meals you've actually logged.
# Flyway builds it from the same migrations the app uses. Credentials still come
# from .env locally, or from environment variables in CI.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/caltracker_test}

# Tests never call FatSecret; the service only needs values to construct.
fatsecret.client-id=test-client-id
fatsecret.client-secret=test-client-secret
