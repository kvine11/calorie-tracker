spring.application.name=calTracker

# Secrets and per-machine values come from the environment. Locally that's a
# gitignored .env at the repo root (template: .env.example); real environment
# variables take precedence over it, which is how a host will supply them.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caltracker}
spring.datasource.username=${DB_USERNAME:caltracker_app}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema: every change is a versioned SQL file in
# src/main/resources/db/migration. Hibernate only validates that the entities
# still match the tables — it never creates or alters anything.
# baseline-on-migrate lets a database that predates Flyway (the original local
# one, built by ddl-auto=update) adopt V1 as already applied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate

# Off, so a lazy association can't quietly fire queries while JSON is written.
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Applies to the RestClient used for FatSecret. Without these a hung upstream
# call holds a request thread indefinitely.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=5s

management.endpoints.web.exposure.include=health

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

fatsecret.client-id=${FATSECRET_CLIENT_ID}
fatsecret.client-secret=${FATSECRET_CLIENT_SECRET}
